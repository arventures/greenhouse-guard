name: greenhouse-guard

services:
  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Greenhouse: "Data Source=/data/greenhouse.db"
    volumes:
      - ./data:/data

  web:
    build: ./frontend
    ports:
      - "4200:4200"
    depends_on:
      - api
